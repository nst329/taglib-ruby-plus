name: native-gems

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the generated gems to GitHub Packages
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: arm64-darwin
          - os: macos-15-intel
            platform: x86_64-darwin

    runs-on: ${{ matrix.os }}

    env:
      MAKEFLAGS: -j2
      PLATFORM: ${{ matrix.platform }}
      TAGLIB_VERSION: 2.3.2
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      SKIP_SWIG: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Read gem version
        run: echo "GEM_VERSION=$(ruby -Ilib -e 'require "taglib/version"; puts TagLib::Version::STRING')" >> "$GITHUB_ENV"

      - name: Build patched TagLib
        run: bundle exec rake vendor

      - name: Verify patched TagLib mdta API
        env:
          TAGLIB_DIR: ${{ github.workspace }}/tmp/${{ env.PLATFORM }}/taglib-${{ env.TAGLIB_VERSION }}
        run: |
          c++ -std=c++17 \
            -I"$TAGLIB_DIR/include" \
            test/mp4_mdta_taglib_core_test.cpp \
            -L"$TAGLIB_DIR/lib" -Wl,-rpath,"$TAGLIB_DIR/lib" -ltag \
            -o "$RUNNER_TEMP/mp4-mdta-taglib-core-test"

      - name: Build native platform gem
        env:
          TAGLIB_DIR: ${{ github.workspace }}/tmp/${{ env.PLATFORM }}/taglib-${{ env.TAGLIB_VERSION }}
          TAGLIB_SOURCE_DIR: ${{ github.workspace }}/tmp/taglib-${{ env.TAGLIB_VERSION }}
          TAGLIB_RUBY_NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_GEM_OUTPUT_DIR: ${{ github.workspace }}/pkg
        run: ruby tasks/build_native_gem.rb

      - name: Install and smoke test native platform gem
        env:
          GEM_HOME: ${{ runner.temp }}/taglib-ruby-plus-gem-home
        run: |
          mkdir -p "$GEM_HOME"
          gem install --local "pkg/taglib-ruby-plus-${GEM_VERSION}-${{ matrix.platform }}.gem" --no-document
          ruby -e 'gem "taglib-ruby-plus", ENV.fetch("GEM_VERSION"); require "taglib_plus"; abort "MP4 API unavailable" unless TagLib::MP4::File'

      - uses: actions/upload-artifact@v4
        with:
          name: taglib-ruby-plus-${{ env.GEM_VERSION }}-${{ matrix.platform }}
          path: pkg/taglib-ruby-plus-${{ env.GEM_VERSION }}-${{ matrix.platform }}.gem

  build-source:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'

      - name: Read gem version
        run: echo "GEM_VERSION=$(ruby -Ilib -e 'require "taglib/version"; puts TagLib::Version::STRING')" >> "$GITHUB_ENV"

      - name: Build source gem
        run: gem build taglib-ruby-plus.gemspec --output "taglib-ruby-plus-${GEM_VERSION}.gem"

      - uses: actions/upload-artifact@v4
        with:
          name: taglib-ruby-plus-${{ env.GEM_VERSION }}-source
          path: taglib-ruby-plus-${{ env.GEM_VERSION }}.gem

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [build, build-source]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          merge-multiple: true

      - name: Configure GitHub Packages credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.gem"
          printf '%s\n' '---' ":github: Bearer ${GITHUB_TOKEN}" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"

      - name: Publish gems to GitHub Packages
        run: |
          set -eu
          for gem in pkg/taglib-ruby-plus-*.gem; do
            gem push --key github \
              --host https://rubygems.pkg.github.com/nst329 \
              "$gem"
          done
