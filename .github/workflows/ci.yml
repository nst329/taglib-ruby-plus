name: ci

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        ruby: ['3.2', '4.0']

    runs-on: ${{ matrix.os }}

    env:
      MAKEFLAGS: -j2
      PLATFORM: x86_64-linux
      TAGLIB_VERSION: 2.3.2
      SWIG_DIR: .swig-v4.1.1
      FFMPEG: ffmpeg

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install FFmpeg for MP4 mdta fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Cache SWIG v4.1.1
        id: cache-swig
        uses: actions/cache@v4
        with:
          path: ~/${{ env.SWIG_DIR }}
          key: swig-${{ matrix.os }}-v4.1.1

      - name: Install SWIG v4.1.1
        if: steps.cache-swig.outputs.cache-hit != 'true'
        run: |
          sudo apt install yodl
          git clone --depth 1 --branch v4.1.1 https://github.com/swig/swig.git
          cd swig
          ./autogen.sh
          ./configure --prefix=$HOME/$SWIG_DIR --with-ruby=$(which ruby) --without-alllang
          make && make install

      - name: Bundle Install
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Cache TagLib (C++)
        id: cache-taglib
        uses: actions/cache@v4
        with:
          path: tmp/${{ env.PLATFORM }}/taglib-${{ env.TAGLIB_VERSION }}
          key: taglib-${{ matrix.os }}-v${{ env.TAGLIB_VERSION }}-${{ hashFiles('patches/taglib/*.patch', 'tasks/build.rb', 'tasks/ext.rake') }}

      - name: Install TagLib (C++)
        if: steps.cache-taglib.outputs.cache-hit != 'true'
        run: bundle exec rake vendor

      - name: Generate SWIG Wrappers
        run: |
          touch ext/*/*.i
          export PATH=$HOME/$SWIG_DIR/bin:$PATH
          TAGLIB_DIR=$PWD/tmp/$PLATFORM/taglib-$TAGLIB_VERSION bundle exec rake swig
          echo 'Generated SWIG wrapper diff (the generated runtime is compiled below)'
          git diff --stat -- ext/*/*_wrap.cxx

      - name: Compile (taglib-ruby-plus)
        run: TAGLIB_DIR=$PWD/tmp/$PLATFORM/taglib-$TAGLIB_VERSION bundle exec rake compile

      - name: Run Tests (taglib-ruby-plus)
        run: bundle exec rake test

      - name: Run MP4 mdta C++ API test
        env:
          TAGLIB_DIR: ${{ github.workspace }}/tmp/${{ env.PLATFORM }}/taglib-${{ env.TAGLIB_VERSION }}
        run: |
          fixture="$RUNNER_TEMP/mp4-mdta-fixture.mp4"
          output="$RUNNER_TEMP/mp4-mdta-output.mp4"
          binary="$RUNNER_TEMP/mp4-mdta-taglib-core-test"
          bundle exec ruby test/generate_mp4_mdta_fixture.rb "$fixture"
          c++ -std=c++17 \
            -I"$TAGLIB_DIR/include" \
            test/mp4_mdta_taglib_core_test.cpp \
            -L"$TAGLIB_DIR/lib" -Wl,-rpath,"$TAGLIB_DIR/lib" -ltag \
            -o "$binary"
          "$binary" "$fixture" "$output"

      - name: Check gemspec file list
        run: bundle exec rake gemspec_check

      - name: Build gem artifact
        run: gem build taglib-ruby-plus.gemspec

      - name: Install and smoke test packaged gem
        env:
          GEM_HOME: ${{ runner.temp }}/taglib-ruby-plus-gem-home
          TAGLIB_DIR: ${{ github.workspace }}/tmp/${{ env.PLATFORM }}/taglib-${{ env.TAGLIB_VERSION }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/tmp/${{ env.PLATFORM }}/taglib-${{ env.TAGLIB_VERSION }}/lib
        run: |
          mkdir -p "$GEM_HOME"
          gem install --local taglib-ruby-plus-2.3.2.4.gem --no-document
          ruby <<'RUBY'
          gem 'taglib-ruby-plus', '= 2.3.2.4'
          require 'fileutils'
          require 'tmpdir'
          require 'taglib_plus'

          raise 'Chapter API is unavailable' unless TagLib::MP4::Chapter

          source = File.expand_path('test/data/mp4.m4a')
          dir = Dir.mktmpdir('taglib-ruby-plus-gem-smoke')
          path = File.join(dir, 'sample.m4a')
          FileUtils.cp(source, path)

          chapters = [
            TagLib::MP4::Chapter.new(start_time: 0, title: 'Opening'),
            TagLib::MP4::Chapter.new(start_time: 500, title: 'Main')
          ]
          file = TagLib::MP4::File.new(path, false)
          file.set_chapters(chapters, style: :preserve)
          raise 'save_chapters failed' unless file.save_chapters
          file.close

          file = TagLib::MP4::File.new(path, false)
          raise 'chapter round-trip failed' unless file.chapters == chapters
          file.close

          file = TagLib::MP4::File.new(path, false)
          tag = file.tag
          raise 'MP4 metadata API unavailable' unless tag.property('title') == 'Title'
          artwork = tag.artwork
          raise 'artwork API unavailable' unless artwork.length == 1
          tag.set_property('description', 'Packaged gem API')
          tag.set_artwork(artwork)
          raise 'metadata API save failed' unless file.save
          file.close

          file = TagLib::MP4::File.new(path, false)
          raise 'metadata API round-trip failed' unless file.tag.property('description') == 'Packaged gem API'
          raise 'artwork API round-trip failed' unless file.tag.artwork.length == 1
          file.close
          FileUtils.remove_entry(dir)
          RUBY
